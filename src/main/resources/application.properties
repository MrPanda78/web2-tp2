spring.application.name=demo
spring.jackson.deserialization.fail-on-null-for-primitives=false

# API externa que se va a consumir para el catálogo de productos
app.dummyjson.base-url=https://dummyjson.com

# PostgreSQL local. Las mismas credenciales están en docker-compose.yml.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/web2_tp2}
spring.datasource.username=${DB_USER:web2}
spring.datasource.password=${DB_PASSWORD:web2_local}

# Flyway es el único responsable de crear y evolucionar las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
